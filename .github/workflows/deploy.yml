name: Build and push image

# Build the Docker image on every push to main and publish it to GHCR.
# Watchtower on the Unraid server watches :latest and auto-deploys new images.
on:
  push:
    branches:
      - main

# GITHUB_TOKEN needs write access to packages to push to GHCR — no manual PAT.
permissions:
  contents: read
  packages: write

env:
  # GHCR image names must be lowercase even if the repo name has capitals.
  IMAGE: ghcr.io/premiumcola/plexquizz-dice

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # GIT_SHA stamps the build label shown in Settings (Dockerfile ARG GIT_SHA).
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
