services:
  plexdice:
    build:
      context: .
      args:
        # Stamped into the Settings build label; set GIT_SHA in the env when building.
        GIT_SHA: "${GIT_SHA:-local}"
    container_name: plexdice
    labels:
      net.unraid.docker.icon: "http://192.168.178.10:8090/icons/icon-512.png"
      net.unraid.docker.webui: "http://192.168.178.10:8090"
    ports:
      - "8090:8080"
    volumes:
      # IMPORTANT: ./data is the ONLY persistent state. Settings, Plex
      # token, library cache and AI cache all live here. On Unraid use
      # an absolute path (e.g. /mnt/user/appdata/plexdice/data) instead
      # of ./data to survive stack redeploys.
      - ./data:/data
    env_file: .env
    # Force public resolvers so Plex's *.plex.direct hostnames always resolve, even
    # when the Unraid host's DNS (Pi-hole, missing forwarder) cannot reach them.
    # If these :53 resolvers are unreachable too, the backend falls back to
    # DNS-over-HTTPS on :443 and pins plex.tv into /etc/hosts (see net_setup.py).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
